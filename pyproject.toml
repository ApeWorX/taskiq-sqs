[project]
name = "taskiq-sqs"
version = "0.0.11"
description = "SQS Broker for TaskIQ"
readme = "README.md"
licence = "MIT"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Framework :: AsyncIO",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = ["taskiq", "broker", "aws", "sqs"]
requires-python = ">=3.11"
dependencies = [
    "taskiq>=0.12.6",
    "capo-s3>=0.15.0",
    "capo-sqs>=0.6.0",
]

[project.urls]
"Source" = "https://github.com/taskiq-python/taskiq-sqs"
"Bug Tracker" = "https://github.com/taskiq-python/taskiq-sqs/issues"
"Repository" = "https://github.com/taskiq-python/taskiq-sqs/"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "examples"},
    {include-group = "docs"},
    "prek>=0.5.3",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-codspeed>=5.0.3",
]
lint = [
    "ruff>=0.16.7",
    "zizmor>=1.30.1",
    "mypy>=2.3.1",
]
examples = [
    "python-dotenv>=1.2.3",
]
docs = [
    "zensical>=0.0.62",
]


[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskiq_sqs"

[tool.mypy]
exclude = "build/"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
markers = [
    "unit: marks unit tests",
    "integration: marks tests with real infrastructure env",
    "benchmark: marks performance benchmarks (run with --codspeed)",
]

[tool.coverage.report]
exclude_lines = [
    "# pragma: no cover",
    "def __repr__",
    "def __str__",
    "def __unicode__",
    "if tp.TYPE_CHECKING:",
]
show_missing = true
skip_empty = true
omit = [
    "*/__init__.py",
    "venv/*",
    "tests/*"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # TODO: enable this rules
    "TRY301",
    "ANN401",
    "FIX002",
    "TD002",
    "TD003",

    # boolean args
    "FBT001",
    "FBT002",

    # Docstrings
    "D104",  # in public package
    "D100",  # in public module

    # Conflicted rules
    "D203",  # with D211
    "D212",  # with D213
    "COM812",  # with formatter

    "EM101",
    "TRY003",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "S101",  # assert usage
    "SLF001",  # private member accessed
    "PLR2004",  # magic values
]
"examples/*" = [
    "T201",  # print
    "D",
    "INP001",
]
"src/taskiq_sqs/middleware.py" = [
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-local-folder = ["taskiq_sqs"]
lines-after-imports = 2

[tool.ruff.lint.pylint]
max-args = 7
