[project]
site_name = "taskiq-sqs"
site_description = "SQS broker and S3 result backend for TaskIQ."
site_author = "Dima Anfimov"
site_url = "https://taskiq-python.github.io/taskiq-sqs/"

repo_url = "https://github.com/taskiq-python/taskiq-sqs"
repo_name = "taskiq-python/taskiq-sqs"

copyright = """
Copyright &copy; 2025-2026 Dima Anfimov
"""

nav = [
  { "Overview" = "index.md" },
  { "Tutorial" = [
    "tutorial/priority_queues.md",
    "tutorial/reliable_task_delivery.md",
    "tutorial/large_payloads_with_s3.md",
  ]},
  { "Contributing" = "contributing.md" },
]

use_directory_urls = true

[project.theme]
language = "en"

features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
